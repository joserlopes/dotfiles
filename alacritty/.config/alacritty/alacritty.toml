[general]
import = [
  # "~/.config/alacritty/vague.toml",
  # "~/.config/alacritty/compline.toml",
  # "~/.config/alacritty/everforest-dark.toml",
  "~/.config/alacritty/kanagawa.toml",
]

[env]
TERM = "xterm-256color"

[mouse]
hide_when_typing = true

[cursor]
unfocused_hollow = true

[font]
size = 18
# normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
# bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
# italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
# normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
# bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
# italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
# normal = { family = "Noto Sans Mono", style = "Regular" }
# bold = { family = "Noto Sans Mono", style = "Bold" }
# italic = { family = "Noto Sans Mono", style = "Italic" }
# normal = { family = "MonaspiceKr NF", style = "Regular" }
# bold = { family = "MonaspiceKr NF", style = "Bold" }
# italic = { family = "MonaspiceKr NF", style = "Italic" }
normal = { family = "Maple Mono NF", style = "Regular" }
bold = { family = "Maple Mono NF", style = "Bold" }
italic = { family = "Maple Mono NF", style = "Italic" }
offset = { x = -1 }

[[keyboard.bindings]]
action = "ToggleFullScreen"
key = "F11"

[window]
padding.x = 14
padding.y = 14
# opacity = 0.85
# decorations = "None"
# startup_mode = "FullScreen"
