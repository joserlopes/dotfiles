# style = "regular"

# [font.bold]
# family = "0xProto Nerd Font"
# family = "IosevkaTerm Nerd Font Propo"
# style = "Bold"

# [font.italic]
# family = "0xProto Nerd Font"
# family = "IosevkaTerm Nerd Font Propo"
# style = "Italic"

[[keyboard.bindings]]
action = "ToggleFullScreen"
key = "F11"

[window]
# startup_mode = "Fullscreen"
opacity = 0.80

