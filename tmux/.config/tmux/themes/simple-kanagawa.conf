# Set status bar background to gray
set -g status-style bg=colour238,fg=white

# Set window status format 
set -g window-status-format "#[fg=white,bg=colour238] #I #W "
set -g window-status-current-format "#[fg=black,bg=colour245] #I #W "

# Set left and right status
set -g status-left-length 50

set -g status-left "#[fg=black,bg=colour245,bold] #S #[bg=colour238,nobold] "
set -g window-status-separator "  "
set -g status-right "#[fg=black,bg=colour245] %H:%M %d-%b-%y "

# Message styling
set -g message-style "fg=#d3c6aa,bg=#4b565c"
